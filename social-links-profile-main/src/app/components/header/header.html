<header class="container-header">
  <figure class="container-img">
    <img class="img-avatar" [src]="avatarImg()" alt="img-avatar" />
  </figure>
  <div class="container-title-country">
    <h1 class="title">{{name()}}</h1>
    <p class="country">{{country()}}</p>
  </div>
  <span class="descrption">{{description()}}</span>
</header>
